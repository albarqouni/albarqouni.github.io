{{ define "main" }}
<article class="lab-page lab-narrow">
  <header class="lab-hero-sm"><p class="lab-kicker">{{ .Params.kicker | default "Legal" }}</p><h1>{{ .Title }}</h1>
    {{ with .Params.subtitle }}<p class="lab-lead">{{ . }}</p>{{ end }}</header>
  <div class="prose dark:prose-invert max-w-none lab-legal">{{ .Content }}</div>
  {{ with .Params.updated }}<p class="lab-meta mt-8">Stand: {{ . }}</p>{{ end }}
</article>
{{ end }}
