# Rules that link publications to projects (applied by scripts/map_projects.py, also during the weekly sync).
#
# Per project (key = folder name under content/projects/):
#   all_authors:  every one of these must be a co-author        (author slug or full name)
#   any_authors:  at least one of these is a co-author
#   keywords:     regular expressions, matched case-insensitively against title + abstract
#   fields:       "title" to match keywords against the title only
#   match:        "authors" (default if authors are given) · "keywords" · "authors+keywords" (both must hold) · "either"
#   from / to:    publication-date window (YYYY or YYYY-MM). Default: one year before the project's start
#                 until three years after its end (papers lag the funding).
#   include:      publication slugs that always belong to the project
#   exclude:      publication slugs that never do
#
# Links are only ever added, never removed. To keep a paper's project list exactly as curated,
# add `projects` to that paper's `sync.locked` list.

gca-us-ai:
  all_authors: [claus-jurgen-bauer, valentin-schaefer]

pdac-fl:
  any_authors: [alexander-semaan]

