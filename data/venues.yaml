# Venue registry — quality indicators shown as badges on publications and in the home-page "Venues" pillar.
#
# Updated every July by scripts/update_venues.py (.github/workflows/update-venues.yml):
#   openalex:        AUTOMATIC — 2-year mean citedness (an open, impact-factor-like metric) and h-index from OpenAlex
#   acceptance:      AUTOMATIC for CV/ML conferences (community dataset lixin4ever/Conference-Acceptance-Rate);
#                    values already present here are never overwritten (hand-curated values win)
#   quartile:        SJR quartile — refreshed when a SCImago CSV is supplied (SCImago blocks automated downloads)
#   impact_factor:   Clarivate JIF — proprietary; seeded from the sources below. The yearly PR lists every journal
#                    whose JIF is older than the latest JCR release so it can be checked in JCR (UniBonn licence).
# Badges prefer the JIF; journals without one show the OpenAlex citedness instead (clearly labelled).
#
# match: case-insensitive substrings used to assign `venue:` to a publication; issn: used to look up OpenAlex/SJR.

# ------------------------------------------------------------------ journals
bmj:
  name: The BMJ
  short: The BMJ
  match: ["^bmj$", "the bmj", "british medical journal"]
  type: journal
  issn: ["0959-8138", "1756-1833"]
  logo: venues/bmj.png
  quartile: Q1
  impact_factor: {value: 42.7, year: 2025, source: "Journal Metrics (JCR June 2026) · ANNU slide", verified: false}
