# Home-page banner: the three Schwerpunkte (content/themes) sit on these pillars.
# Each pillar becomes a tab with headline stats, a photo/logo mosaic and its own pins on the globe.
#
# stats:  [value, label]. Values in {braces} are computed from the site at build time:
#         {members} {alumni} {publications} {journals} {q1} {projects} {active_projects} {partners} {countries}
#         {offerings} {courses} {schools} {talks} {conferences} {meetings} {events} {datasets} {demos}
# media:  files in assets/media/ (photos are resized automatically). `w: 2` spans two columns.
# pins:   orgs: [keys in data/organizations.yaml] | places: [keys in data/places.yaml]
#         | auto: funded-partners | community | network | omi
# inflows: [[lon, lat], ...] arcs drawn *into* Bonn (e.g. home countries of school participants)
- key: team
  label: Team
  icon: brand/comi-bee-white.png
  color: "#173869"
  link: /team/
  stats:
    - ["{members}", "team members & collaborators today"]
    - [">30", "researchers trained over 5 years"]
    - ["6 PIs", "Computational AG at BonnJour"]
  media:
    - {src: act/team-researchers.jpg, cap: Researchers, w: 2}
    - {src: act/team-collab.jpg, cap: Clinical collaborators, w: 2}
    - {src: act/bonnjour.jpg, cap: "BonnJour, Sep. 2025"}
    - {src: act/bonnjour-office.jpg, cap: Our space}
  pins: {orgs: [uni-bonn, ukb]}
  pin_label: BonnJour, Bonn

- key: data
  label: Datasets
  icon: icons/datasets.png
  color: "#2d9d9b"
  link: /datasets/
  stats:
    - ["{datasets}", "curated clinical datasets & benchmarks"]
    - ["13", "institutions · 6 clinics"]
    - ["4K", "patients"]
  media:
    - {src: act/d-mammo.jpg, cap: "200K · Mammography"}
    - {src: act/d-us-gca.jpg, cap: "1,030 US · GCA"}
    - {src: act/d-mri-neo.jpg, cap: "300 MRI · neonatal uLF"}
    - {src: act/d-wsi.jpg, cap: "236 WSI · histology"}
    - {src: act/d-ct-pdac.jpg, cap: "546 CT · PDAC"}
    - {src: act/d-cfp.jpg, cap: ">8K CFP · retina"}
    - {src: act/d-msk.jpg, cap: "176 CT · musculoskeletal"}
    - {src: act/d-mr-prostate.jpg, cap: "500 MR · csPCa"}
  pins: {orgs: [ukb, charite, umg, ukhd, ukt, uker, tum, lmu, usz-zurich, hug-geneva, gemelli-rome, osaka, unimelb]}
  pin_label: clinical and data partners

