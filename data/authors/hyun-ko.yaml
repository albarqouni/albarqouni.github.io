bio: '# Biography

  Dr Ko is a multilingual German and Australian board-certified radiologist and clinician researcher with 20+ years international radiology experience with subspecialist knowledge in oncological, body, breast and pediatric imaging.


  Dr Ko’s focus has been on harnessing clinical and research data to advance translational medicine. Her most recent research includes higher computational analysis, artificial intelligence, and radiomics to develop predictive imaging biomarkers.


  In recognition of her contribution, Dr Ko was chosen as one of six finalists at the 19th Annual Research Australia Award 2022 (category: Data & Innovation). She is an active member of RANZCR Advisory Committee on Artificial Intelligence and of the German Roentgen Society (DRG) Working Party Methodology and Research.


  Dr Ko is passionate about supporting aspiring researchers. Over recent years she has supervised several MD candidates as well as medical and biomedical research students. A strong supporter of evidence-based medicine, Dr Ko believes in the strengths of multidisciplinarity and inclusiveness as key ingredients of research innovation and impact.'
