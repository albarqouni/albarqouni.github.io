bio: Michele Guerra wrote his M.Sc. thesis at the Technical University of Munich (2021–2022) in our academia–industry collaboration with deepc, co-supervised with Abhijeet Parida and Mehmet Yigitsoy (deepc). His thesis compared unsupervised anomaly-detection baselines for full-head CT and showed that keeping the skull lets the model detect fractures (CTFSH); it also released supplementary labels for the public CQ500 dataset.
