bio: '# Biography

  Dr Qiongkai Xu is a research fellow on Security in NLP at the University of Melbourne. His research lies in among Privacy & Security, Natural Language Processing, Machine Learning and Data Mining. Lately, his attention has been directed towards auditing machine learning models, specifically in two areas: 1) uncovering privacy and security concerns in ML/NLP models and 2) developing evaluation theory and methods for ML/NLP models from various perspectives.


  He is currently awarded DAAD Net AI fellowship and visiting Bonn Univeristy for a week (18-22 Sep. 23) to investigate possible collaboration.'
