bio: '# Biography

  Anna Lisitsyna works with Dr. Shadi Albarqouni at Helmholtz AI as a research scientist. Lisitsyna has acquired a programming and mathematical background at Lomonosov Moscow State Universtity, before relocating to Munich to get a Master''s and learn to apply programming and mathematics to medicine. During the Masters program, she learns Machine Learning, specifically in application to medical imaging data. Her PhD project was conncerned with the application of machine learning to chemical datasets, metabolomics in particular, and developing algorithms and pipelines for data analysis, including neural networks and genetic algorithms.'
