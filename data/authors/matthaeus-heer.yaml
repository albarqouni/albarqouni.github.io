bio: Matthäus Heer did his master's thesis at the Computer Vision Lab of ETH Zurich (Ender Konukoglu), co-supervised by Shadi Albarqouni at Helmholtz AI, on quantifying trust in pathology segmentation from brain MRI with little supervision. The work became "The OOD Blind Spot of Unsupervised Anomaly Detection" (MIDL 2021), which showed that unsupervised anomaly detectors can fail on out-of-distribution inputs. He was then affiliated with the Physics Institute of the University of Zurich.
