bio: Valentin S.Schäfer, M.D., is a consultant and serves as Head of the Department of Rheumatology and Clinical Immunology at the Clinic of Internal Medicine III at the University Hospital Bonn in Germany. Dr.Schäfer also serves as Head of the Ultrasound Diagnostic Unit and as Speaker of the Center for Rare Rheumatological Diseases. He holds the academic rank of a University Professor at the Medical Faculty of the University Bonn, Germany. He has a focus on imaging and immunology in psoriatic arthritis and rheumatoid arthritis as well as vasculitis.
