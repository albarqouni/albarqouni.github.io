bio: Carsten Marr is founding director of the Institute of AI for Health at Helmholtz Munich and, since July 2025, Professor of AI in Hematology and Cell Therapy at LMU University Hospital. His lab develops AI for the diagnosis and treatment of blood disorders such as leukaemia. Awards include an ERC Consolidator Grant and the 2024 Eugen Münch Prize.
