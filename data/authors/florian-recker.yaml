bio: PD Dr. med. Florian Recker, MME, is a specialist in obstetrics and gynaecology with a focus on special obstetrics and prenatal medicine at the MVZ of the University Hospital Cologne. Previously at the University Hospital Bonn, where he headed the Center for Ultrasound Research and Innovations in Obstetrical Science (CURIOS), he collaborates with us on AI for obstetric ultrasound.
