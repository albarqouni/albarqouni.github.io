bio: '# Biography


  Carlos studied a Bachelor''s degree in Telecommunication Technologies at University Carlos III of Madrid (UC3M) and then decided to complement his education with a Master''s degree in Telecommunications Engineering at the same university. He combined these last studies with a research grant at the Imdea Networks Institute. After that, he started working in a startup focused mainly on the application of artificial intelligence techniques in the railway sector with renowned companies such as London Underground or Deutsche Bahn. At the end of 2019, he was hired as a research engineer in the Department of Bioengineering at UC3M to work on the improvement of radiology systems. After two years working on different projects he has started his PhD under the supervision of [Prof. Dr. Monica Abella](https://image.hggm.es/en/en-monica-abella). His thesis studies the application of Deep Learning methods in X-ray systems, from image acquisition to tomographic image reconstruction. This work is done
  in collaboration with one of the main hospitals in Spain (Hospital Universitario Gregorio Marañón) and the company SEDECAL. Currently, Carlos is doing a six-month research internship (Nov. 2022 - Apr. 2023) at Albarqouni Lab at the University Hospital Bonn. He is working under the supervision of [Prof. Dr. Shadi Albarqouni](https://albarqouni.github.io/authors/shadi-albarqouni) on the topic [Weakly-Supervised Federated Learning for Chest X-ray Imaging](https://albarqouni.github.io/students/theses/MA_Thesis_Weakly_Supervised_Federated_Learning_for_Chest_X-ray_Imaging.pdf).'
