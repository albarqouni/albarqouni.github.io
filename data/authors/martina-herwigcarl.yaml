bio: 'Prof. Dr. Martina C. Herwig-Carl is a German Board-certified ophthalmologist and ophthalmic pathologist currently serving as a consultant at the University Hospital Bonn’s Department of Ophthalmology in Bonn, Germany. Her research career began with a focus on ophthalmic pathology during her residency and fellowship at the University Eye Hospital of Bonn, followed by a fellowship at Emory Eye Clinic, USA. There, she researched uveal melanoma, specifically exploring macrophage types and their roles, and contributed significantly to ophthalmic pathology literature.


  In Bonn, Prof. Dr. Herwig-Carl established a research group on ocular tumors and advanced her research in uveal melanoma, including pioneering work in tumor-associated macrophages and epigenetics. She has held numerous scientific appointments, published extensively, and received multiple grants and awards. Additionally, she actively contributes to various professional societies, such as serving as the Secretary of the International Society of Ophthalmic Pathology (ISOP) and as a co-chair in the German Society of Ophthalmology’s ophthalmic pathology division.'
