bio: Mayar Lotfy (Mayar Lotfy Mostafa) worked with Shadi Albarqouni at the Chair for Computer Aided Medical Procedures (CAMP), TU Munich, on proximal femur fracture classification in X-ray images — investigating focal loss for class-imbalanced fracture classification and uncertainty estimation for fracture grading. She went on to a doctorate with TUM CAMP and Carl Zeiss on AI for surgical and hyperspectral imaging, including graph neural networks for robust tumour segmentation and masked autoencoders for surgical event recognition.
