bio: '# Biography

  Razieh is currently working as an ML researcher at Prof. Dr. Shadi Albarqouni''s lab. She earned her Master''s degree in Computational Science and Engineering from TU-Munich. While pursuing her Master''s, she completed an internship at BMW, where she worked on ML projects, and concurrently conducted her thesis in AI. Later, she worked at LMU-Klinikum as an AI researcher working on the medical applications of Graph Neural Networks, Transformers, and Explainable AI. She aspires to have meaningful contributions to the intersection of AI and medicine while working at Albarqouni Lab.'
