bio: Nina Bondarenko, MD, PhD, is Associate Professor (Docent) in the Department of Pathological Anatomy, Forensic Medicine and Pathological Physiology at Dnipro State Medical University, Ukraine, and chairs the university's Council of Young Scientists. Her research covers histopathological and molecular-genetic approaches to the diagnosis and prognosis of urothelial carcinoma, and transmission electron microscopy of intercellular junctions. She is a member of the European Society of Pathology, the European Microscopy Society, ASCO and the Association of Pathologists of Ukraine. She is co-PI of the MISTAI project on AI for computational pathology in bladder cancer.
