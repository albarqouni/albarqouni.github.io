bio: Prof. Dr. Dr. Jakob Weiß is Managing Senior Physician for Research (Geschäftsführender Oberarzt Wissenschaft) at the Department of Diagnostic and Interventional Radiology, University Medical Center Freiburg, where he heads the Cross-Sectional Imaging Center and the Section of Abdominal and Oncologic Radiology. He develops AI-derived imaging biomarkers of biological ageing (previously at Massachusetts General Hospital, where he co-developed CXR-Age) and is co-PI of our DFG project on estimating ageing from chest imaging.
