bio: Anees Kazi did her PhD and a short postdoc at the Chair for Computer Aided Medical Procedures (CAMP), TU Munich, working with Shadi Albarqouni and Nassir Navab on deep learning for proximal femur fracture classification and on graph convolutional networks for disease prediction — InceptionGCN, attention-based and self-attention graph convolutions, and inductive graph networks — as well as federated learning for histopathology. She is now a Research Fellow in Radiology at Massachusetts General Hospital and Harvard Medical School (Laboratories for Computational Neuroimaging, Martinos Center), applying graph deep learning to diffusion-MRI brain connectomes.
