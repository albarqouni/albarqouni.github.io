bio: Amal Lahiani did her PhD (2016–2020) as an external PhD student at the Chair for Computer Aided Medical Procedures (CAMP), TU Munich, and Roche Diagnostics in Penzberg, working with Shadi Albarqouni. Her work on digital pathology introduced virtual staining of whole slide images with unsupervised GANs — synthesising immunohistochemistry stains from H&E — together with perceptual embedding consistency for seamless tile-wise style transfer, and one-shot colour-deconvolution networks for multistain tissue segmentation. She continued at Roche working on deep learning for pathology.
