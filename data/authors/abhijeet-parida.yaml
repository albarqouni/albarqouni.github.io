bio: Abhijeet Parida did his M.Sc. in Computational Science and Engineering at the Technical University of Munich (2019), with a master's thesis on data-efficient semantic segmentation in collaboration with Allianz, working with Shadi Albarqouni. Its medical spin-off, "Learn to Segment Organs with a Few Bounding Boxes", trains organ segmentation from a handful of box annotations. After working on AI for medical imaging at deepc GmbH (including full-head CT anomaly detection, CTFSH), he became an R&D DevOps Engineer at Children's National Hospital, Washington DC, where he works on MRI harmonisation, brain tumour segmentation, federated learning and foundation models for paediatric imaging, and is pursuing a PhD at Universidad Politécnica de Madrid.
