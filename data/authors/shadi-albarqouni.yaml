bio: "Shadi Albarqouni is a Palestinian-German Professor of Computational Medical Imaging Research. He received his B.Sc. and M.Sc. in Electrical Engineering from the IU Gaza, Palestine, in 2005, and 2010, respectively. In 2012, he received the [DAAD](www.daad.de) research grant to pursue his Ph.D. at the [Chair for Computer Aided Medical Procedures (CAMP)](https://www.in.tum.de/campar/start/), [Technical University of Munich (TUM)](https://www.tum.de/), Germany. During his Ph.D., Albarqouni worked with [Prof. Nassir Navab](https://scholar.google.de/citations?user=kzoVUPYAAAAJ&hl=en) on developing machine learning algorithms to handle noisy labels, coming from crowdsourcing, in medical imaging. His [AggNet](https://ieeexplore.ieee.org/document/7405343) paper, published at the [Special Issue on Deep Learning](https://ieeexplore.ieee.org/xpl/tocresult.jsp?isnumber=7463083) at the [IEEE Transaction on Medcial Imaging](https://ieeexplore.ieee.org/xpl/RecentIssue.jsp?punumber=42) (IF: 10.048),\
  \ was among the first ones on Medical Imaging with Deep Learning and has been featured as the [top downloaded article](https://ieeexplore.ieee.org/stamp/stamp.jsp?arnumber=8700676) for a couple of years at IEEEXplore. \n\nRight before he received his Ph.D. in Computer Science with *summa cum laude* in 2017, Albarqouni worked as a [Senior Research Scientist & Team Lead](https://www.in.tum.de/campar/members/senior-affiliates/shadi-albarqouni/) at [CAMP](https://www.in.tum.de/campar/start/) leading the [Medical Image Analysis (MedIA)](http://campar.in.tum.de/Chair/ResearchIssueMedicalImage). Together with his team addressed the common challenges concern the nature of medical data, namely heterogeneity, severe class-imbalance, few amounts of annotated data, inter-/intra-scanners variability (domain shift), inter-/intra-observer disagreement (noisy annotations). In 2019, Albarqouni received the prestigious [P.R.I.M.E. fellowship](https://www.daad.de/en/study-and-research-in-germany/scholarships/prime-fellows-201819/)\
  \ for a one-year international mobility, where he worked as a [Visiting Scientist](https://bmic.ee.ethz.ch/people/person-details.shadi-alberqouni.html) at the [Department of Information Technology and Electrical Engineering (D-ITET)](https://ee.ethz.ch/) at [ETH Zürich](https://ethz.ch/en.html), Switzerland. He worked with [Prof. Ender Konukoglu](http://people.ee.ethz.ch/~kender/) on [Modeling Uncertainty in Medical Imaging](project/uncertainty/), in particular, the one associated with inter-/intra-raters variability. Afterwards, Albarqouni worked as a Visting Scientist with [Prof. Daniel Rueckert](http://wp.doc.ic.ac.uk/dr/) at the [Department of Computing](https://www.imperial.ac.uk/computing) at [Imperial College London](http://www.imperial.ac.uk/), United Kingdom. \n\nSince Nov. 2020, Albarqouni has been appointed as an [AI Young Investigator Group Leader](https://www.helmholtz.ai/themenmenue/our-research/research-groups/albarqouni-group/index.html) at [Helmholtz AI](https://www.helmholtz.ai/).\
  \  The aim of Albarqouni's Lab. is to develop innovative deep [Federated Learning](project/federated-learning) algorithms that can distill and share the knowledge among AI agents in a robust and privacy-preserved fashion. Since Jan. 2022, Albarqouni has been appointed as a W2 Professor of Computational Medical Imaging Research at the [Faculty of Medicine](https://www.medfak.uni-bonn.de/de), [University of Bonn](https://www.uni-bonn.de/en). \n\nAlbarqouni has more than 100 peer-reviewed publications in both Medical Imaging Computing and Computer Vision published in high impacted journals and top-tier conferences. He serves as a reviewer for many journals, *e.g.*, [IEEE TPAMI](https://www.computer.org/csdl/journal/tp), [MedIA](https://www.journals.elsevier.com/medical-image-analysis), [IEEE TMI](https://www.embs.org/tmi/), [IEEE JBHI](https://www.embs.org/jbhi/), [IJCARS](https://www.springer.com/journal/11548) and [Pattern Recognition](https://www.journals.elsevier.com/pattern-recognition),\
  \ and top-tier conferences, *e.g.,* [ECCV](https://eccv2020.eu/), [MICCAI](https://www.miccai2020.org/en/), [MIDL](https://2020.midl.io/), [BMVC](https://britishmachinevisionassociation.github.io/bmvc), [IPCAI](http://www.ipcai.org/), and [ISBI](http://2020.biomedicalimaging.org/) among others. He is also an active member of [MICCAI](http://www.miccai.org/members), [BMVA](http://www.bmva.org/), [IEEE EMBS](https://www.ieee.org/membership-catalog/productdetail/showProductDetailPage.html?product=MEMEMB018), [IEEE CS](https://www.ieee.org/membership-catalog/productdetail/showProductDetailPage.html?product=MEMC016), and [ESR](https://www.myesr.org/) society. Recently, Albarqouni has been elected as a member for the European Lab for Learning and Intelligent Systems ([ELLIS](https://ellis.eu/members)), the Arab German Young Academy ([AGYA](http://www.agya.info/)), and the Higher Council for Innovation and Excellence‎ in Diaspora ([HCIE](https://hcie.ps/?lang=en)). Since 2015, he has been serving\
  \ as a PC member for a couple of MICCAI workshops, *e.g.*, [COMPAY](https://compay19.grand-challenge.org/organizers/),  [DART](https://sites.google.com/view/dart2020/organization), [DCL](https://dcl-workshop.github.io/), [FAIR](https://sites.google.com/view/fair-workshop-2021/home) among others. Since 2019, Albarqouni has been serving as an [Area Chair](https://www.miccai2019.org/committee/) in Advance Machine Learning Theory at [MICCAI](http://www.miccai.org/). Recently, he has been serving as a Program Co-Chair at [MIDL'22](https://2022.midl.io/organization.html) in Swizterland, and as an Organizing Committee Member at [ISBI'22](https://biomedicalimaging.org/2022/organizing-committee/) in India, MICCAI'24 in Morocco. \n\nHis current research interests include Interpretable ML, Robustness, Uncertainty, and Federated Learning. He is also interested in Entrepreneurship and Startups for Innovative Medical Solutions with limited resources."
