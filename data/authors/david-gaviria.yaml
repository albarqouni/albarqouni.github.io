bio: '# Biography

  David is currently pursuing his PhD at the University Hospital Bonn, under the guidance of Prof. Dr. Shadi Albarqouni. With a background in engineering and informatics, he completed his interuniversity master''s degree in AI in 2022 from the Facultat d''Informàtica de Barcelona (FIB), which is a joint program of Universitat Politècnica de Catalunya, Universitat de Barcelona, and Universitat Rovira i Virgili. With over two years of industry experience in software development, David secured the first position in the live SIIM-ISIC 2019 competition for skin lesion classification and published a full paper at the International Conference VISAPP 2023. His goal is to leverage his skills and knowledge to make valuable contributions to the field of AI in medicine at the Albarqouni Lab.'
