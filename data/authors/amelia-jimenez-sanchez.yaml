bio: Amelia Jiménez-Sánchez studied Biomedical Computing (M.Sc.) at the Technical University of Munich, where she worked with Shadi Albarqouni and Diana Mateus at the Chair for Computer Aided Medical Procedures (CAMP) on the automatic classification of proximal femur fractures in X-ray images, together with the Klinikum rechts der Isar. She continued the collaboration during her PhD at Pompeu Fabra University, Barcelona (INPhINIT "la Caixa" fellow), on weakly-supervised and interpretable fracture classification and on capsule networks for medical imaging data challenges. After a postdoc at the PURRlab, IT University of Copenhagen, she joined the BCN-AIM lab at the University of Barcelona in 2025 to work on multimodal foundation models for cardiology.
