bio: Nassir Navab is Full Professor and Director of the Chair for Computer Aided Medical Procedures and Augmented Reality (CAMP) at TUM, where he has been a full professor since 2003, and an adjunct professor at Johns Hopkins University. He is an IEEE Fellow and ELLIS Fellow; honours include the MICCAI Enduring Impact Award (2021). He was the PhD advisor of Shadi Albarqouni.
