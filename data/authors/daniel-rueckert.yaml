bio: Daniel Rückert holds the Alexander von Humboldt Professorship for AI in Healthcare and Medicine at TUM (since 2020) and directs the Institute for AI and Informatics in Medicine at Klinikum rechts der Isar; he is also Professor of Visual Information Processing at Imperial College London. His research develops AI methods for biomedical image acquisition, analysis and interpretation. Honours include the Leibniz Prize (2025), Fellowship of the Royal Society (2025) and the MICCAI Enduring Impact Award (2024).
