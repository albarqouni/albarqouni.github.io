bio: Agnieszka Tomczak did her PhD at the Technical University of Munich and Siemens AG (2023), co-supervised in our group, on deep learning for the analysis of white blood cells — including digital staining of leukocytes with confidence estimation, multi-task multi-domain learning for leukocyte classification, and label-uncertainty estimation for quality assurance. She is now a postdoctoral researcher at the German Heart Center Munich, working on deep-learning-based 3D reconstruction of cardiac vasculature.
