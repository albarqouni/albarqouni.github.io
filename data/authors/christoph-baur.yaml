bio: 'Christoph Baur did his PhD at the Chair for Computer Aided Medical Procedures (CAMP), TU Munich, working closely with Shadi Albarqouni. His thesis, "Anomaly Detection in Brain MRI: From Supervised to Unsupervised Deep Learning", helped establish unsupervised anomaly segmentation with deep autoencoders, including the widely used comparative study of autoencoders in Medical Image Analysis. He also worked on generative models for medical image synthesis, semi-supervised learning, multiple sclerosis lesion segmentation, catheter detection in X-ray images and mitosis detection in histology. He is now Director of Software Imaging Products at Rohde & Schwarz.'
