bio: '# Biography

  Diletta is currently pursuing her PhD at the M.O.D.A.L. research group @University of Naples Federico II, under the supervision of Prof. Francesco Piccialli, the lab''s head and scientific director. She holds a master’s degree in Statistical Sciences, completed in 2021 from the same university.

  With over two years of research experience, particularly in Federated Learning, and collaborations with industries on AI models for Industry and Education 4.0, Diletta aims to leverage her expertise to address open issues in Federated Learning, such as solving statistical and device heterogeneity, making significant contributions to this field of AI.'
