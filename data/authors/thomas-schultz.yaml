bio: Thomas Schultz has been Professor at the University of Bonn since 2013, heading the Visualization and Medical Image Analysis group at b-it and the Institute of Computer Science, and is a Principal Investigator at the Lamarr Institute. His research addresses uncertainty, domain generalisation and explainability of deep learning for neuroradiology and ophthalmology.
