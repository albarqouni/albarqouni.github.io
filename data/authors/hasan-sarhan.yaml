bio: Hasan Sarhan did his PhD at the Technical University of Munich (2024), co-supervised in our group, on representation learning and fair AI for medical imaging. His work covered disentangled representations with adversarial VAEs, fairness through orthogonal disentangled representations (ECCV 2020), and microaneurysm segmentation for diabetic retinopathy screening. He is now a Senior Data Scientist at Johnson & Johnson, working on AI for surgery, and is committed to sharing AI and data-science knowledge with middle-income countries.
