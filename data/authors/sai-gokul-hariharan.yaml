bio: Sai Gokul Hariharan did his industrial PhD at the Technical University of Munich (Dr. rer. nat., 2023) jointly with Advanced Therapies, Siemens Healthineers (Forchheim), supervised by Nassir Navab and Norbert Strobel and mentored in our group. His thesis, "Novel analytical and learning-based image processing techniques for dose reduction in interventional X-ray imaging", introduced noise-model-driven spatio-temporal denoising of low-dose fluoroscopy and digital subtraction angiography, and a real-time learning-based denoiser trained only on simulated low-dose images. He continued this work at Siemens Healthineers, where he is a named inventor on several patents on X-ray noise reduction.
