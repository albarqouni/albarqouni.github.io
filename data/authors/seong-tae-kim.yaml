bio: Seong Tae Kim directs the Augmented Intelligence (AMI) Lab at Kyung Hee University, where he is Associate Professor in the School of Computing. He received his PhD from KAIST (2019) and was previously a senior research scientist at CAMP, TUM. His research covers explainable and reliable deep learning and medical image analysis.
