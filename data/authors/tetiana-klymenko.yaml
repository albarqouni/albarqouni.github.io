bio: Tetiana Klymenko studied at the Technical University of Munich and worked with Shadi Albarqouni at the Chair for Computer Aided Medical Procedures (CAMP), in collaboration with the LMU radiation-oncology team (Guillaume Landry, Christopher Kurz, Kirsten Lauber). Her work led to Butterfly-Net (ISBI 2021), a spatial-temporal memory network that segments tumours in longitudinal CT scans by using earlier time points and clinical factors.
