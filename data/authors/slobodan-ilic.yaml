bio: Slobodan Ilic is a Senior Key Expert Research Scientist at Siemens AG in Munich (since 2014) and Adjunct Professor at the Chair for Computer Aided Medical Procedures (CAMP), TU Munich, where he led the Computer Vision Group from 2009 to 2014. He received his PhD from EPFL under Pascal Fua. His research covers model-based computer vision, 3D reconstruction, and the detection, tracking and pose estimation of rigid and deformable objects. With our lab he co-supervised industry-academic PhD projects on CAD-based pose estimation for mobile X-ray devices and on digital staining of blood cells.
