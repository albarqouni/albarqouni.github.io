bio: "# Biography\n\nCosmin Ionuț Bercea is a Researcher at the Albarqouni Lab led by [Shadi Albarqouni](https://albarqouni.github.io) at [Helmholtz AI](https://www.helmholtz.ai) and the [Technical University of Munich (TUM)](https://www.tum.de). \n\nHe was granted a study scholarship by the [e.V. Villigst](https://www.evstudienwerk.de) and received his B.Sc. and M.Sc. in Computer Science from the [Friedrich-Alexander University of Erlangen-Nuremberg (FAU)](https://www.fau.de), Germany, in 2015, and 2018, respectively. During his master, Bercea did an internship abroad at the [Computer Vision Centre (CVC)](http://www.cvc.uab.es) in Barcelona, Spain, where he developed machine learning algorithms for action recognition. He completed his master thesis at [Siemens Healthineers](https://www.siemens-healthineers.com), where he worked with [Olivier Pauly](https://scholar.google.com/citations?user=32cZkQEAAAAJ&hl=en), [Florin C. Ghesu](https://scholar.google.com/citations?hl=en&user=Z1-KZ8RoM6YC)\
  \ and [Prof. Andreas K. Maier](https://scholar.google.com/citations?hl=en&user=MA6SDuEAAAAJ) on developing novel machine learning algorithms using [shared memory](https://www.springerprofessional.de/en/shamann-shared-memory-augmented-neural-networks/16739794) for medical imaging. Since then, Bercea has worked as a research engineer at [Bosch Corporate Research](https://www.bosch.com/research/) where he developed perception and behaviour prediction machine learning algorithms for self-driving cars. His current research interests include Precision Medicine, Anomaly Detection, Image Understanding and Federated Learning."
