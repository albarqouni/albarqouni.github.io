bio: Yousef Yeganeh did his PhD (2020–2025) at the Chair for Computer Aided Medical Procedures (CAMP), TU Munich, on machine learning for medical imaging under data heterogeneity. With Shadi Albarqouni he introduced Inverse Distance Aggregation (IDA) for federated learning with non-IID data (DART/DCL 2020), and his later work includes shape-aware masking for inpainting, the Y-Net dual-encoder segmentation network and latent drifting in diffusion models for counterfactual medical image synthesis (CVPR 2025). He is now a lecturer at Aalto University and a researcher at TU Munich.
