bio: '# Biography


  Barbara Wichtmann is a radiology resident who is very passionate about quantitative MRI and Deep Learning for medical image analysis. As an outstanding medical student at her home university, the University of Heidelberg in Germany, she was privileged to pursue a master''s degree in medical physics parallel to her medical studies. Funded by the German Academic Scholarship Foundation and a medical engineering scholarship from the Klee Family Foundation, she was granted the opportunity to conduct her master’s thesis at the MGH/HST Athinoula A. Martinos Center for Biomedical Imaging in Boston, USA. There, she was very fortunate to carry out DWI experiments on the Connectome MRI scanner in Larry Wald''s research group and eventually completed her master''s thesis on microstructure imaging in 2017 with highest distinction. Barbara Wichtmann aspires to work at the forefront of oncologic MRI and, as a future radiologist and medical physicist at the research-clinical interface, to advocate for
  an expedited translation of pivotal innovations such as Deep Learning into the clinic.'
