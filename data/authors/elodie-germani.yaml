bio: "# Biography\n\nElodie Germani works with Prof. Shadi Albarqouni as a postdoctoral researcher. She did her PhD at the University of Rennes, under the supervision of Dr. Camille Maumet and Prof. Elisa Fromont. After four years of medicine school at the University of Versailles, she took a shift in her career and started a Master's degree in bioinformatics. \n\nHer research focuses on exploring, modelling and building solutions to take into account the variability of data in medical imaging, particularly using deep representation learning. During her PhD, her goal was to facilitate the re-use of data shared on public databases by taking into account the different sources of variability. In the future, she would like to focus more in the use of real-world data and on the robustness of machine learning models to dataset shifts and privacy attacks."
