bio: Roger D. Soberanis-Mukul did his PhD (2016–2022) at the Chair for Computer Aided Medical Procedures (CAMP), TU Munich, working with Shadi Albarqouni and Nassir Navab on uncertainty-driven graph convolutional networks for refining organ segmentation (MIDL 2020, MELBA) and on artefact-aware polyp detection in endoscopy (EAD challenge). After a postdoc at the ARCADE Lab, Johns Hopkins University (2022–2025), he became a researcher at ICube and IHU Strasbourg, University of Strasbourg.
