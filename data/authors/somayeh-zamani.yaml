bio: '# Biography




  Somayeh Zamani is a researcher at the Albarqouni Lab at the University Hospital Bonn. Her research focuses on machine learning and AI-driven clinical systems using real-world healthcare data. She works on developing reliable and explainable AI methods, including graph-based and deep learning approaches, for building intelligent clinical AI assistants that support medical decision-making. Before her doctoral research, she worked as a machine learning engineer and data scientist in both academia and industry, contributing to applied AI solutions. She holds an M.Sc. in Computer Engineering from the University of Tehran.'
