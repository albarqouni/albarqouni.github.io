bio: '# Biography


  Ashkan Shakarami is a Computer Scientist and Postdoctoral Fellow in Artificial Intelligence at the Histology Lab, Department of Ophthalmology ([Prof. Martina Herwig-carl](../martina-herwigcarl/)) at the University Hospital Bonn. His research focuses on Artificial General Intelligence (AGI), Computer Vision, Neural Networks, Computer-Aided Diagnosis, Histopathology, and Ophthalmology. Ashkan specializes in the design of Computer-Aided Diagnosis (CAD) systems for Medical Disease Diagnosis. He obtained his PhD from the University of Padova and was a visiting PhD researcher at the Technical University of Munich.'
