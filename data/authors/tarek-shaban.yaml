bio: M. Tarek Shaban did his master's thesis at the Chair for Computer Aided Medical Procedures (CAMP), TU Munich, supervised by Shadi Albarqouni, Christoph Baur and Nassir Navab. The thesis became StainGAN (ISBI 2019), which removes stain colour variation between labs and scanners in digital histology by unpaired image-to-image translation with cycle-consistent GANs, so that no pathologist has to pick a reference slide. StainGAN is one of the most widely used stain-normalisation methods, with more than 400 citations, and its code is available on GitHub.
