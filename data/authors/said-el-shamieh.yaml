bio: Said El Shamieh is Professor of Human Genetics at the Faculty of Health Sciences, Beirut Arab University, and Adjunct Researcher at the Institut de la Vision, Sorbonne Université, Paris. His research covers the genetics of inherited retinal diseases, pharmacogenomics in Middle Eastern populations, statistical genetics of cardiovascular and metabolic traits, and multi-omics integration.
